<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LSE Study Hub · 学习中心</title>
<meta name="theme-color" content="#3B37B5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400..500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hub.css">
</head>
<body>
<div id="top"></div>
<header class="hero">
  <div id="band"></div>
  <div class="wrap in">
    <p class="kicker">London School of Economics · Department of Mathematics</p>
    <h1>Study Hub</h1>
    <div class="meta">
      <span class="pill" id="reviewPill">复习加载中…</span>
    </div>
  </div>
</header>

<main class="wrap" style="margin-top:22px">
  <div class="sec-h"><h2>我的课程</h2><span class="en">Courses</span></div>
  <div class="grid c2" id="courses"></div>

</main>

<footer class="wrap"><b>LSE Study Hub</b></footer>

<script src="assets/hub.js"></script>
<script src="data/ma221.js"></script>
<script src="data/fm214.js"></script>
<script>
  var H = window.LSEHUB;
  document.getElementById("top").outerHTML = H.topbar("index.html");
  document.getElementById("band").innerHTML = H.bandSVG({ color: "#ffffff", opacity: 0.55 });

  var due = H.cardsDue().length, total = H.cards().length;
  document.getElementById("reviewPill").innerHTML = due
    ? '今天要复习 <b>' + due + '</b> 张 · <a href="review.html">开始 →</a>'
    : (total ? '错题本 ' + total + ' 张，今天无到期 ✓' : '错题本还是空的 · 学起来就会攒起来');

  var box = document.getElementById("courses");
  Object.keys(H.courses).forEach(function (code) {
    var co = H.courses[code];
    var weeksDone = co.weeks.filter(function (w) { return H.weekDone(code, w.n); }).length;
    var ex = H.courseExStats(code);
    var spine = co.weeks.map(function (w) {
      var cls = H.weekDone(code, w.n) ? "done" : (w.status === "active" ? "active" : "");
      return '<span class="n ' + cls + '">' + w.n + "</span>";
    }).join("");
    var exPct = ex.total ? Math.round(100 * ex.done / ex.total) : 0;
    var a = document.createElement("a");
    a.className = "course-card"; a.href = "course.html?c=" + code;
    a.style.setProperty("--caccent", co.accent);
    a.innerHTML =
      '<div class="top">' +
        '<div class="code">' + H.esc(co.code) + ' · ' + H.esc(co.term) + '</div>' +
        '<div class="cname">' + H.esc(co.title) + '</div>' +
        '<div class="czh">' + H.esc(co.titleZh) + '</div>' +
      '</div>' +
      '<div class="body">' +
        '<div class="spine">' + spine + '</div>' +
        '<div class="progline" style="margin-bottom:7px"><span>周次 ' + weeksDone + '/' + co.weeks.length + '</span></div>' +
        '<div class="progline"><span>作业 ' + ex.done + '/' + ex.total + '</span><span class="bar ' + (exPct === 100 ? "ok" : "") + '"><i style="width:' + exPct + '%"></i></span></div>' +
      '</div>';
    box.appendChild(a);
  });
</script>
</body>
</html>
